<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Palmmicro Python Web{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="site-title">Palmmicro Python Web</div>
    <nav class="site-nav">
      <a href="{{ url_for('main.index') }}">首页</a>
      <a href="{{ url_for('status.status_page') }}">状态</a>
    </nav>
  </header>
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    Python 迁移第一版，仅展示已迁移的基金估值数据。
  </footer>
</body>
</html>
