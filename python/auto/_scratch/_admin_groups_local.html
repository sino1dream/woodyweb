  <h1>后台 · 分组管理</h1>
  <p class="hint">
    <strong>演示环境说明</strong>：PHP 后台页挂在登录会员下（未登录时提交不执行），
    这里不接账号体系，所有分组归属于演示会员 <code>member_id=1</code>，
    写操作立即生效。改数据前请自行备份。
  </p>

  <p class="table-note">
    共 2 个分组。
    <a href="/admin/group/new">新建分组</a>
  </p>

  <table class="data-table admin-groups">
    <thead>
      <tr>
        <th style="width: 50px;">ID</th>
        <th>分组名</th>
        <th style="width: 70px;">成员数</th>
        <th>成员符号</th>
        <th style="width: 140px;">操作</th>
      </tr>
    </thead>
    <tbody>
      
        <tr>
          <td>1</td>
          <td><a href="/admin/group/1">演示分组A</a></td>
          <td>3</td>
          <td>SZ161125, SH513100, SZ159501</td>
          <td>
            <a href="/admin/group/1">编辑</a>
            <form method="post" action="/admin/group/1/delete"
                  style="display:inline;"
                  onsubmit="return confirm('确认删除分组「演示分组A」及其 3 个成员？');">
              <button type="submit" class="link-button">删除</button>
            </form>
          </td>
        </tr>
      
        <tr>
          <td>2</td>
          <td><a href="/admin/group/2">演示分组B</a></td>
          <td>2</td>
          <td>QQQ, SPY</td>
          <td>
            <a href="/admin/group/2">编辑</a>
            <form method="post" action="/admin/group/2/delete"
                  style="display:inline;"
                  onsubmit="return confirm('确认删除分组「演示分组B」及其 2 个成员？');">
              <button type="submit" class="link-button">删除</button>
            </form>
          </td>
        </tr>
      
    </tbody>
  </table>

  </main>
  <footer class="site-footer">
    Python 迁移第一版，仅展示已迁移的基金估值数据。
  </footer>
